name: AI Code Smell Analysis

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  models: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze code smells with AI
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Analyze the Python files modified in this pull request.

            Detect at least these code smells:

            1. Long Method
            2. Duplicated Code

            For each issue found:
            - File name
            - Explanation
            - Refactoring suggestion